plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// v1.2: fast cancellable connect, embedded WARP credentials fallback,
// endpoint rotation with handshake verification, instant disconnect.
// Same debug keystore as v1.0/v1.1 so it installs as an update.
def keystoreFile = file(System.getProperty("user.home") + "/.android/debug.keystore")

android {
    namespace 'com.mahyar.simplevpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.mahyar.simplevpn"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
}
