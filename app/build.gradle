plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// v2.0: NEW signing keystore (old debug keystore lost in sandbox reset) —
// users must uninstall any previous version before installing this one.
// v1.5 engine: 15s hard connect budget (2.5s handshake windows), instant pool
// fallback, Persian user messages, success-ordered fast routes.
def keystoreFile = file("/home/z/my-project/toolchain/keystore/simplevpn.keystore")

android {
    namespace 'com.mahyar.simplevpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.mahyar.simplevpn"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword "simplevpn123"
            keyAlias "simplevpn"
            keyPassword "simplevpn123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
}
