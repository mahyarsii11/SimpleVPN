plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// v1.3: 28-route rotation across all WARP ranges (incl. 188.114.x and IPv6),
// per-route diagnostics, 6s registration timeouts.
// Same debug keystore as v1.0–v1.2 so it installs as an update.
def keystoreFile = file(System.getProperty("user.home") + "/.android/debug.keystore")

android {
    namespace 'com.mahyar.simplevpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.mahyar.simplevpn"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
}
